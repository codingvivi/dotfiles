exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=wlroots

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1

smart_gaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=1

overview_gap_inner=5
overview_gap_outer=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=0
tap_and_drag=0
drag_lock=1
trackpad_natural_scrolling=1
trackpad_click_method=2
trackpad_disable_while_typing=0
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# sub config load
#source=./env.conf
source=./rule.conf
source=./appearance.conf
source=./bind.conf

# exec_once=~/.config/mango/autostart.sh
exec_once=systemctl --user start mangowc.target

exec_once=notify-send "Mango started!"
exec_once=mmsg dispatch toggle_render_border
exec=notify-send "(Re)loaded mango config!"
